# Publishes the container image to ghcr.io/avestura/persian-captcha.
#
# A release is cut by tagging the source, nothing else:
#
#   git tag v1.2.3
#   git push origin v1.2.3
#
# The tag becomes the image version (baked into the binary via -X main.version,
# the same way `make docker` does it locally) and a GitHub release is created
# for it with generated notes. A stable tag like v1.2.3 also moves the 1.2, 1
# and latest tags; a pre-release like v1.2.3-rc.1 is published under its own
# name only, so `latest` never points at something unfinished.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

# Two pushes of the same tag should not race each other to the registry.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/avestura/persian-captcha

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          flavor: |
            latest=auto

      # The Dockerfile runs go vet and go test in its build stage, so a tag on
      # a broken commit fails here and publishes nothing.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --generate-notes $prerelease \
            --notes "Container image: \`docker pull ${IMAGE}:${TAG#v}\`"
